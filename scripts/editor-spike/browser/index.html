<!doctype html>
<meta charset="utf-8" />
<title>Editor F0 browser harness</title>
<body style="font: 14px system-ui">
  <p>Editor F0 harness. Measurements are run from the page console via <code>window.F0</code>.</p>
  <script>
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    const round = (x) => Math.round(x * 100) / 100;
    const pct = (arr, p) => {
      const s = [...arr].sort((a, b) => a - b);
      return s.length ? round(s[Math.min(s.length - 1, Math.floor((p / 100) * s.length))]) : null;
    };
    const stats = (arr) => ({
      n: arr.length,
      p50: pct(arr, 50),
      p90: pct(arr, 90),
      max: arr.length ? round(Math.max(...arr)) : null,
    });
    const rng = (seed) => () => {
      seed |= 0;
      seed = (seed + 0x6d2b79f5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };

    function makeVideo(url) {
      const v = document.createElement("video");
      v.muted = true;
      v.playsInline = true;
      v.preload = "auto";
      v.style.cssText =
        "position:fixed;left:0;top:0;width:320px;height:180px;opacity:0.05;pointer-events:none";
      document.body.appendChild(v);
      v.src = url;
      return v;
    }

    function waitMetadata(v, timeout = 30000) {
      return new Promise((resolve) => {
        const done = (outcome) => {
          clearTimeout(timer);
          v.removeEventListener("loadedmetadata", onMeta);
          v.removeEventListener("error", onErr);
          resolve(outcome);
        };
        const onMeta = () => done("loaded");
        const onErr = () => done("error");
        const timer = setTimeout(() => done("timeout"), timeout);
        v.addEventListener("loadedmetadata", onMeta);
        v.addEventListener("error", onErr);
        if (v.readyState >= 1) done("loaded");
      });
    }

    function nextFrame(v, timeout = 5000) {
      return new Promise((resolve) => {
        const timer = setTimeout(() => resolve(null), timeout);
        v.requestVideoFrameCallback((now, meta) => {
          clearTimeout(timer);
          resolve({ now, mediaTime: meta.mediaTime });
        });
      });
    }

    function frameAtOrAfter(v, t, timeout = 5000) {
      return new Promise((resolve) => {
        const timer = setTimeout(() => resolve(null), timeout);
        const onFrame = (now, meta) => {
          if (meta.mediaTime >= t - 1 / 30) {
            clearTimeout(timer);
            resolve({ now, mediaTime: meta.mediaTime });
          } else {
            v.requestVideoFrameCallback(onFrame);
          }
        };
        v.requestVideoFrameCallback(onFrame);
      });
    }

    async function save(name, data) {
      await fetch(`/save/${name}`, { method: "POST", body: JSON.stringify(data, null, 2) });
      return data;
    }

    async function probe(urls) {
      const out = [];
      for (const url of urls) {
        const v = makeVideo(url);
        const t0 = performance.now();
        const loaded = await waitMetadata(v);
        const outcome = loaded === "loaded" && v.videoWidth === 0 ? "no-video" : loaded;
        out.push({
          url,
          outcome,
          msToMetadata: round(performance.now() - t0),
          errorCode: v.error ? v.error.code : null,
          width: v.videoWidth,
          height: v.videoHeight,
          duration: round(v.duration),
        });
        v.remove();
      }
      return save("browser-probe.json", {
        userAgent: navigator.userAgent,
        visibility: document.visibilityState,
        results: out,
      });
    }

    async function playback(url, seconds = 3, warmupMs = 1000) {
      const v = makeVideo(url);
      await waitMetadata(v);
      const cbTimes = [];
      const mediaTimes = [];
      let running = true;
      let windowStart = null;
      const onFrame = (now, meta) => {
        if (windowStart !== null && now >= windowStart) {
          cbTimes.push(now);
          mediaTimes.push(meta.mediaTime);
        }
        if (running) v.requestVideoFrameCallback(onFrame);
      };
      v.requestVideoFrameCallback(onFrame);
      await v.play();
      await sleep(warmupMs);
      const before = v.getVideoPlaybackQuality();
      windowStart = performance.now();
      await sleep(seconds * 1000);
      running = false;
      v.pause();
      const after = v.getVideoPlaybackQuality();
      const unique = [...new Set(mediaTimes.map((m) => m.toFixed(4)))].map(Number);
      const mediaSpan = unique.length > 1 ? unique[unique.length - 1] - unique[0] : 0;
      const intervals = cbTimes.slice(1).map((t, i) => t - cbTimes[i]);
      const result = {
        url,
        visibility: document.visibilityState,
        presentedFrames: after.totalVideoFrames - before.totalVideoFrames,
        droppedFrames: after.droppedVideoFrames - before.droppedVideoFrames,
        uniqueMediaFrames: unique.length,
        mediaFps: round((unique.length - 1) / mediaSpan),
        callbackIntervalMs: stats(intervals),
        wallSeconds: seconds,
      };
      v.remove();
      return result;
    }

    async function seeks(url, n = 20) {
      const v = makeVideo(url);
      await waitMetadata(v);
      v.pause();
      const random = rng(42);
      const latencies = [];
      const misses = [];
      for (let i = 0; i < n; i++) {
        const target = round(random() * Math.max(0, v.duration - 0.5));
        const pending = nextFrame(v);
        const t0 = performance.now();
        v.currentTime = target;
        const frame = await pending;
        if (frame) latencies.push(performance.now() - t0);
        else misses.push(target);
      }
      const result = {
        url,
        duration: round(v.duration),
        seeks: n,
        presentationMs: stats(latencies),
        missed: misses.length,
      };
      v.remove();
      return result;
    }

    async function switches(url, tA = 1, tB = 7, n = 5) {
      const cold = [];
      const warm = [];
      for (let i = 0; i < n; i++) {
        const v = makeVideo(url);
        await waitMetadata(v);
        v.currentTime = tA;
        await nextFrame(v);
        const t0 = performance.now();
        v.src = url;
        await waitMetadata(v);
        const pending = frameAtOrAfter(v, tB);
        v.currentTime = tB;
        const frame = await pending;
        if (frame) cold.push(performance.now() - t0);
        v.remove();
      }
      for (let i = 0; i < n; i++) {
        const a = makeVideo(url);
        const b = makeVideo(url);
        await Promise.all([waitMetadata(a), waitMetadata(b)]);
        a.currentTime = tA;
        b.currentTime = tB;
        await Promise.all([nextFrame(a), nextFrame(b)]);
        await a.play();
        const pending = nextFrame(b);
        const t0 = performance.now();
        a.pause();
        b.style.opacity = "1";
        await b.play();
        const frame = await pending;
        if (frame) warm.push(performance.now() - t0);
        a.remove();
        b.remove();
      }
      return { url, tA, tB, coldSeekPaintMs: stats(cold), warmPlayStartMs: stats(warm) };
    }

    const SOURCES = [
      "/media/fixtures/cfr-25.mp4",
      "/media/fixtures/cfr-30.mp4",
      "/media/fixtures/ntsc-30000-1001.mp4",
      "/media/fixtures/vfr-30-gaps.mp4",
      "/media/fixtures/vertical-rotated-90.mp4",
      "/media/fixtures/no-audio-30.mp4",
      "/media/fixtures/prores-422-mov.mov",
      "/media/fixtures/hd-1080-30-detail-long-gop.mp4",
      "/media/proxies/p540-gop15.mp4",
      "/media/proxies/p540-intra.mp4",
      "/media/proxies/p720-gop30.mp4",
      "/media/proxies/p540-gop15-from-prores.mp4",
    ];
    const SEEK_SOURCES = SOURCES.filter((u) => !u.includes("prores-422"));

    async function suite(name) {
      window.F0_progress = { name, state: "running", done: [] };
      const log = (item) => window.F0_progress.done.push(item);
      if (name === "playback") {
        const results = [];
        for (const u of SOURCES) {
          results.push(await playback(u, 3));
          log(u);
        }
        return save("browser-playback.json", { userAgent: navigator.userAgent, results });
      }
      if (name === "seeks") {
        const results = [];
        for (const u of SEEK_SOURCES) {
          results.push(await seeks(u, 20));
          log(u);
        }
        return save("browser-seeks.json", { userAgent: navigator.userAgent, results });
      }
      if (name === "switches") {
        const results = [];
        for (const u of SEEK_SOURCES) {
          results.push(await switches(u, 1, 7, 5));
          log(u);
        }
        return save("browser-switches.json", { userAgent: navigator.userAgent, results });
      }
      throw new Error(`unknown suite ${name}`);
    }

    async function diagSeek(url, t = 7) {
      const v = makeVideo(url);
      await waitMetadata(v);
      const seen = [];
      let running = true;
      const onFrame = (now, meta) => {
        seen.push({
          now: round(now),
          media: Math.round(meta.mediaTime * 1000) / 1000,
          presented: meta.presentedFrames,
        });
        if (running) v.requestVideoFrameCallback(onFrame);
      };
      v.requestVideoFrameCallback(onFrame);
      v.currentTime = t;
      await sleep(1500);
      running = false;
      const info = {
        readyState: v.readyState,
        seeking: v.seeking,
        currentTime: v.currentTime,
        error: v.error ? v.error.code : null,
        frames: seen.slice(0, 12),
        count: seen.length,
      };
      v.remove();
      return info;
    }

    window.F0 = { probe, playback, seeks, switches, save, suite, diagSeek };
    window.F0_suite = (name) => {
      suite(name)
        .then(() => (window.F0_progress.state = "done"))
        .catch(
          (e) =>
            (window.F0_progress = { ...window.F0_progress, state: "error", message: String(e) }),
        );
      return "started";
    };
  </script>
</body>
