name: CI + Release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Quality gate: runs on every push (main, PRs, and tags).
  # When a tag is pushed, this job must pass before release starts.
  test:
    name: Lint & Test
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: npm ci

      - name: Validate tagged release source
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: node scripts/release-metadata.mjs --tag $env:GITHUB_REF_NAME

      - name: Prepare ffmpeg
        # npm ci runs postinstall, but this is idempotent and keeps the CI
        # dependency local to the repo.
        timeout-minutes: 2
        run: npm run fetch:ffmpeg

      - name: Install Python test dependencies
        run: python -m pip install --quiet -r python/requirements-test.txt

      - name: Verify
        run: npm run verify

  # Build & publish: only runs on tag pushes.
  # `needs: test` ensures the Windows quality gate passes before packaging.
  release:
    name: Build & Release (Windows)
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate version, notes and main ancestry
        shell: pwsh
        run: |
          node scripts/release-metadata.mjs --tag $env:GITHUB_REF_NAME --notes "$env:RUNNER_TEMP/release-notes.md"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release tag must belong to main' }

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Build bundled processor & fetch ffmpeg
        run: |
          npm run build:processor
          npm run fetch:ffmpeg

      - name: Install Python test dependencies
        run: python -m pip install --quiet -r python/requirements-test.txt

      - name: Run Python delogo tests
        # Run the Python pipeline tests on Windows where ffmpeg is guaranteed
        # to be available after the fetch step above.
        run: npm run test:python

      - name: Build renderer
        # Inject Supabase credentials so the login gate and user-management
        # panel are compiled into the shipped renderer. Vite bakes VITE_*
        # env vars at build time; without these, isSupabaseConfigured is false
        # and BeruRoot boots straight into the editor (no login screen). The
        # .env file is gitignored so it is never present on the runner — these
        # secrets are the only source. If a secret is missing the build still
        # succeeds but ships without auth (graceful fallback).
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npx vite build

      - name: Package installer
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $env:CSC_IDENTITY_AUTO_DISCOVERY = 'false'
          if ($env:WINDOWS_CERTIFICATE_BASE64) {
            $env:CSC_LINK = $env:WINDOWS_CERTIFICATE_BASE64
            $env:CSC_KEY_PASSWORD = $env:WINDOWS_CERTIFICATE_PASSWORD
            $env:BERU_SIGNING_MODE = 'signed'
          } else {
            $env:BERU_SIGNING_MODE = 'unsigned'
          }
          "BERU_SIGNING_MODE=$env:BERU_SIGNING_MODE" >> $env:GITHUB_ENV
          npx electron-builder --config scripts/electron-builder.config.cjs --win --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify installer signature
        shell: pwsh
        run: ./scripts/verify-installer-signature.ps1 -Mode $env:BERU_SIGNING_MODE

      - name: Verify packaged version and update metadata
        run: node scripts/release-metadata.mjs --tag $env:GITHUB_REF_NAME --dist dist-installer

      - name: Publish installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $assets = @("dist-installer/Beru-Setup-$version.exe", "dist-installer/Beru-Setup-$version.exe.blockmap", 'dist-installer/latest.yml')
          $release = gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --json isDraft
          if ($LASTEXITCODE -eq 0) {
            if (-not ($release | ConvertFrom-Json).isDraft) { throw 'Refusing to overwrite a published release' }
          } else {
            gh release create $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --verify-tag --draft --title $env:GITHUB_REF_NAME --notes-file "$env:RUNNER_TEMP/release-notes.md"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload $env:GITHUB_REF_NAME @assets --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $remote = gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --json assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $expectedNames = @($assets | ForEach-Object { Split-Path -Leaf $_ })
          $actualNames = @(($remote | ConvertFrom-Json).assets | ForEach-Object { $_.name })
          if ($actualNames.Count -ne 3 -or @(Compare-Object $expectedNames $actualNames).Count -ne 0) { throw 'Unexpected release assets' }
          $verification = Join-Path $env:RUNNER_TEMP 'release-verification'
          gh release download $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --dir $verification --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/release-metadata.mjs --tag $env:GITHUB_REF_NAME --dist $verification --assets-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $localMap = (Get-FileHash -Algorithm SHA512 -LiteralPath $assets[1]).Hash
          $remoteMap = (Get-FileHash -Algorithm SHA512 -LiteralPath (Join-Path $verification $expectedNames[1])).Hash
          if ($localMap -ne $remoteMap) { throw 'Uploaded blockmap differs from local build' }
          gh release edit $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --notes-file "$env:RUNNER_TEMP/release-notes.md" --draft=false --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installers
        uses: actions/upload-artifact@v6
        with:
          name: beru-installers
          path: |
            dist-installer/*.exe
            dist-installer/*.exe.blockmap
            dist-installer/latest.yml
          if-no-files-found: error
          retention-days: 14
